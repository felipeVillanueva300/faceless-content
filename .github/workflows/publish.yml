name: Publicar Reel diario

on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      publicar_id:
        description: "ID del video a PUBLICAR (ej: daily-20260907-025109). Vacío = generar un borrador nuevo."
        type: string
        default: ""
      serie_tema:
        description: "SERIE: tema a forzar hoy (ej: 'cómo manejar tu tarjeta de crédito'). Vacío = día normal."
        type: string
        default: ""
      serie_parte:
        description: "SERIE: número de parte (ej: 2)"
        type: string
        default: ""
      serie_total:
        description: "SERIE: total de partes, si lo sabes (ej: 4)"
        type: string
        default: ""
      serie_subtema:
        description: "SERIE: qué toca EXACTAMENTE hoy (ej: 'la fecha de pago y cuándo comprar tras el corte')"
        type: string
        default: ""
      serie_anterior:
        description: "SERIE: qué ya se cubrió antes, para NO repetirlo (ej: 'Parte 1 explicó la fecha de corte')"
        type: string
        default: ""
      serie_formato:
        description: "SERIE: formato opcional (howto, tip, dato, error, mito, comparativa). Vacío = paso a paso."
        type: string
        default: ""

permissions:
  contents: write  

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Instalar ffmpeg y fuentes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
 
      - name: Instalar dependencias
        run: pip install -r requirements.txt
 
      - name: Generar o publicar (con reintentos del job completo)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 60
          command: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS || 'gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash-lite' }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: "public"
          WATERMARK_TEXT: "@dinerosimplemx"
          PUBLISH_ID: ${{ inputs.publicar_id }}
          SERIE_TEMA: ${{ inputs.serie_tema }}
          SERIE_PARTE: ${{ inputs.serie_parte }}
          SERIE_TOTAL: ${{ inputs.serie_total }}
          SERIE_SUBTEMA: ${{ inputs.serie_subtema }}
          SERIE_ANTERIOR: ${{ inputs.serie_anterior }}
          SERIE_FORMATO: ${{ inputs.serie_formato }}
          PUBLISH: "false"
          GRAPH_VERSION: v23.0
          NICHE: "tecnología y finanzas"
          TTS_VOICE: es-MX-JorgeNeural
          AI_IMAGE_ENABLED: "1"
          AI_IMAGE_PROVIDER: ${{ vars.AI_IMAGE_PROVIDER || 'cloudflare' }}
          AI_IMAGE_MODE: ${{ vars.AI_IMAGE_MODE || 'mix' }}
          AI_IMAGE_SEED: ${{ vars.AI_IMAGE_SEED || '7' }}
          SEGMENTED_BG: ${{ vars.SEGMENTED_BG || '1' }}
          TTS_RATE: ${{ vars.TTS_RATE || '+5%' }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}