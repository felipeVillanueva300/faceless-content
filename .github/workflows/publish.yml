name: Publicar Reel diario

on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:  
    inputs:
      publicar:
        description: "¿Publicar en redes? (false = solo borrador para revisar)"
        type: choice
        default: "false"
        options: ["false", "true"]

permissions:
  contents: write  

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar ffmpeg y fuentes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar y publicar (con reintentos del job completo)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3   
          retry_wait_seconds: 60  
          command: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          WATERMARK_TEXT: "@villanuevagallegosf"
          PUBLISH: ${{ github.event_name == 'schedule' && 'true' || inputs.publicar }}
          GRAPH_VERSION: v23.0
          NICHE: "tecnología y finanzas"
          TTS_VOICE: es-MX-JorgeNeural