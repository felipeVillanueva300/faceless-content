name: Prueba de voz (temporal, se borra)
on:
  push:
    branches: [prueba-voz-wifi]
jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt faster-whisper
      - run: python -u prueba_voz.py
        env:
          TTS_VOICE: es-MX-JorgeNeural
          TTS_RATE: "+5%"
      - uses: actions/upload-artifact@v4
        with:
          name: prueba-voz
          path: prueba_voz_out/
